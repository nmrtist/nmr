name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tests/downstream/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path tests/downstream/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Full acceptance in release mode
        run: cargo test --release --all-targets --all-features --locked
      - run: cargo test --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - name: Downstream application and allocation acceptance
        env:
          CARGO_TARGET_DIR: target/downstream
        run: |
          cargo run --manifest-path tests/downstream/Cargo.toml --release --locked
          cargo run --manifest-path tests/downstream/Cargo.toml --release --locked -- performance
      - run: cargo package --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 test --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
